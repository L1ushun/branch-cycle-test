name: cycle

# 触发即一轮循环：合并当前所有 ready 的 PR 到主分支，然后从最新主分支切出新分支并建 draft PR
# 如需固定周期兜底，可加：
#   schedule:
#     - cron: '10 10 * * 5'
on:
  workflow_dispatch:
    inputs:
      new_branch:
        description: '新分支名（留空则用 dev-日期）'
        required: false
        default: ''
  push:
    branches: [master]
    paths: ['TRIGGER_CYCLE']

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge-and-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Merge ready PRs into master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 无 wip 标签的 PR 视为开发完成（GITHUB_TOKEN 无法操作 draft，改用 wip 标签表达"开发中"）
          prs=$(gh pr list --base master --json number,labels \
            -q '.[] | select(([.labels[].name] | index("wip")) | not) | .number')
          if [ -z "$prs" ]; then
            echo "没有 ready 状态的 PR，跳过合并步骤"
          else
            for pr in $prs; do
              echo ">>> 合并 PR #$pr"
              # 不加 --delete-branch：release 分支保留作版本归档
              gh pr merge "$pr" --merge || echo "!!! PR #$pr 合并失败，跳过"
            done
          fi

      - name: Cut new branch & open WIP PR
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_BRANCH: ${{ inputs.new_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # runner 内置 gh 版本较旧，不支持 --if-not-exists，用 || 兜底实现幂等
          gh label create wip --description "开发中，CI 全绿后由 auto-ready 自动移除" --color d73a4a 2>/dev/null || echo "wip 标签已存在"
          git checkout master
          git pull origin master
          # 版本自增：取「远程现存 release 分支」与「已合并 release PR 标题」中的最大版本，minor +1
          # （合并会删旧分支，所以必须同时看已合并 PR 的标题，否则版本号会回退）
          # 没有任何 release 记录时从 v1.17.0 起步
          branch_max=$(git ls-remote --heads origin 'refs/heads/release/v*' \
            | awk -F/ '{print $NF}' | sed 's/^v//' | sort -V | tail -1)
          merged_max=$(gh pr list --state merged --base master --limit 50 --json title \
            -q '.[].title' | grep -oE 'release/v[0-9]+\.[0-9]+\.[0-9]+' | sed 's|release/v||' | sort -V | tail -1)
          last=$(printf '%s\n%s\n' "$branch_max" "$merged_max" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "${NEW_BRANCH:-}" ]; then
            BRANCH="$NEW_BRANCH"
          elif [ -z "$last" ]; then
            BRANCH="release/v1.17.0"
          else
            major=${last%%.*}
            rest=${last#*.}
            minor=${rest%%.*}
            BRANCH="release/v$((major)).$((minor+1)).0"
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "!!! 分支 $BRANCH 已存在，退出（可用 new_branch 输入参数手动指定）"
            exit 1
          fi
          echo ">>> 切出新分支 $BRANCH"
          git checkout -b "$BRANCH"
          git commit --allow-empty -m "chore: start cycle $BRANCH"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "merge: $BRANCH" \
            --body "自动创建的开发分支 PR。CI 全绿后 auto-ready 移除 wip 标签，下次触发 cycle 时合并。" \
            --label wip
          echo ">>> 完成，CI 全绿后自动 ready，下一轮触发时合并此 PR"
